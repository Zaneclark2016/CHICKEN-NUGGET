<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chicky Nuggs</title>
    <link rel="icon" href="https://raw.githubusercontent.com/Zaneclark2016/website-image/main/chicknnug.jpeg">
    <style>
        #nugy{
            position: absolute;
            left: 275px;
            top: 180px;
            width: 75px;
            height: 195px;
            z-index: 2;
            display: none;
        }
        .spinning {
            animation: chaos 1s linear infinite;
        }
        @keyframes chaos {
            0% { transform: translate(-50%,-50%) rotate(0deg) scale(1);}
            25% { transform: translate(-50%,-50%) rotate(90deg) scale(2);}
            50% { transform: translate(-50%,-50%) rotate(180deg) scale(1);}
            75% { transform: translate(-50%,-50%) rotate(270deg) scale(3);}
            100% { transform: translate(-50%,-50%) rotate(360deg) scale(1);}
        }
        #mufasa{
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        body{
            background-color: black;
        }
    </style>
</head>
<body>
    <img src="https://raw.githubusercontent.com/Zaneclark2016/website-image/main/chicknnug.jpeg" id="nugy">
    <img src="https://raw.githubusercontent.com/Zaneclark2016/website-image/main/mufasa.png" id="mufasa">
    <audio id="chicknaudio" src="https://raw.githubusercontent.com/Zaneclark2016/website-image/main/Record%20(online-voice-recorder.com).mp3"></audio>
    <audio id="chicknaudio2" src="https://raw.githubusercontent.com/Zaneclark2016/website-image/main/all%20i%20want-chikn.mp3"></audio>
    <script>
        const chicknaudio = document.getElementById("chicknaudio");
        const chicknaudio2 = document.getElementById("chicknaudio2");
        const mufasa = document.getElementById("mufasa");
        const nugy = document.getElementById("nugy");
        chicknaudio.load();
        chicknaudio2.load();
        document.addEventListener("click", function() {
            mufasa.style.display = "block";
            nugy.style.display = "none";
            chicknaudio.currentTime = 0;
            chicknaudio.play();
            setTimeout(function() {
            chicknaudio.pause();
            mufasa.style.display = "none";
            nugy.style.display = "none"
            chicknaudio2.play();
            chicknaudio2.addEventListener("ended",function() {
                chicknaudio.currentTime = 3.6;
                nugy.style.height = "1000px";
                nugy.style.width = "500px";
                nugy.style.display = "block";
                nugy.style.left = "50%";
                nugy.style.top = "50%";
                nugy.style.transform = "translate(-50%, -50%)";
                nugy.classList.add("spinning")
                chicknaudio.play();
            });
        },3500);
        }, { once:true });
        chicknaudio.addEventListener("ended",function() {
            chicknaudio.currentTime = 0;
            chicknaudio.play();
        });
    </script>
</body>
</html>
